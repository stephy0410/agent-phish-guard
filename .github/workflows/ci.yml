name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      # No AWS credentials here: validate checks the configuration against the provider schema.
      - name: Validate bootstrap
        run: terraform -chdir=infra/bootstrap init -input=false && terraform -chdir=infra/bootstrap validate
      - name: Validate infra
        run: terraform -chdir=infra init -backend=false -input=false && terraform -chdir=infra validate
      - name: Validate compute
        run: terraform -chdir=infra/compute init -backend=false -input=false && terraform -chdir=infra/compute validate
