[project]
name = "agent-phish-guard"
version = "0.1.0"
description = "Guardrails that protect AI agents from phishing pages, using Strands Decider 2B and Amazon Bedrock."
readme = "phish_guard/README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Arxevia" }]
requires-python = ">=3.11"
keywords = ["strands", "strands-decider", "ai-agents", "guardrails", "prompt-injection", "amazon-bedrock", "llm-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# What the installable phish_guard package needs. The demo's own packages are in the "demo" group.
dependencies = [
    "pydantic>=2.7",
    "strands-agents>=1.61",
]

[project.urls]
Repository = "https://github.com/stephy0410/agent-phish-guard"
Documentation = "https://github.com/stephy0410/agent-phish-guard/blob/main/phish_guard/README.md"
Issues = "https://github.com/stephy0410/agent-phish-guard/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# The demo in this repo: the HTML chunker (tools/) and `aws login` credentials for Bedrock.
demo = [
    "beautifulsoup4>=4.15.0",
    "botocore[crt]>=1.43.114",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the reusable guardrails are installed. agent/, guardrails/, tools/ and eval/ are this
# repo's demo, imported from the repo root.
packages = ["phish_guard"]

[tool.hatch.build.targets.sdist]
# The source release carries the same package and its license files, not the demo or the eval.
include = ["phish_guard", "LICENSE", "NOTICE"]

[tool.uv]
default-groups = ["dev", "demo"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "bedrock: calls Amazon Bedrock; needs AWS credentials and RUN_BEDROCK_TESTS=1",
    "decider: calls the local Decider server; needs it running and RUN_DECIDER_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
